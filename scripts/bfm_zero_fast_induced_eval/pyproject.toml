[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bfm-zero-fast-induced-eval"
version = "0.1.0"
description = "Headless batched BFM-Zero induced-fall evaluation and replay collection"
requires-python = ">=3.10,<3.11"
dependencies = [
    "h5py==3.14.0",
    "joblib==1.5.1",
    "numpy==1.26.4",
    "nvidia-cublas-cu12==12.4.5.8",
    "nvidia-cuda-nvrtc-cu12==12.4.127",
    "nvidia-cuda-runtime-cu12==12.4.127",
    "nvidia-cudnn-cu12==9.1.0.70",
    "nvidia-cufft-cu12==11.2.1.3",
    "onnx==1.16.1",
    "onnxruntime-gpu==1.22.0",
]

[project.scripts]
bfm-zero-fast-induced-eval = "bfm_zero_fast_induced_eval.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bfm_zero_fast_induced_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
